<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Cadastro de doadores e voluntários da Novo Futuro.">
    <link rel="stylesheet" href="css/styles.css">
    <title>Novo Futuro - Cadastro</title>
</head>
<body>
    <header>
        <img src="imagens/logo.png" alt="Logo da Novo Futuro">
        <h1>Cadastro de apoiadores</h1>
        <nav aria-label="Navegação principal">
            <a href="index.html">Início</a>
            <a href="projetos.html">Projetos</a>
            <a href="cadastro.html">Cadastro</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>Quero contribuir</h2>
            <p>Preencha seus dados. Os campos marcados com * são obrigatórios.</p>

            <form id="formCadastro">
                <fieldset>
                    <legend>Dados pessoais</legend>

                    <p>
                        <label for="nome">Nome completo *</label><br>
                        <input type="text" id="nome" name="nome" required
                               autocomplete="name" minlength="3" maxlength="100">
                    </p>

                    <p>
                        <label for="email">E-mail *</label><br>
                        <input type="email" id="email" name="email" required
                               autocomplete="email" maxlength="120">
                    </p>

                    <p>
                        <label for="cpf">CPF *</label><br>
                        <input type="text" id="cpf" name="cpf" required
                               inputmode="numeric"
                               pattern="[0-9]{3}\.?[0-9]{3}\.?[0-9]{3}-?[0-9]{2}"
                               placeholder="000.000.000-00"
                               title="Informe um CPF com 11 dígitos, com ou sem pontuação.">
                    </p>

                    <p>
                        <label for="nascimento">Data de nascimento *</label><br>
                        <input type="date" id="nascimento" name="nascimento" required
                               autocomplete="bday">
                    </p>

                    <p>
                        <label for="telefone">Telefone *</label><br>
                        <input type="tel" id="telefone" name="telefone" required
                               inputmode="tel" autocomplete="tel"
                               pattern="\(?[0-9]{2}\)?\s?[0-9]{4,5}-?[0-9]{4}"
                               placeholder="(11) 99999-9999"
                               title="Informe um telefone no formato (11) 99999-9999.">
                    </p>
                </fieldset>

                <fieldset>
                    <legend>Endereço</legend>

                    <p>
                        <label for="cep">CEP *</label><br>
                        <input type="text" id="cep" name="cep" required
                               inputmode="numeric" autocomplete="postal-code"
                               pattern="[0-9]{5}-?[0-9]{3}"
                               placeholder="00000-000"
                               title="Informe um CEP com 8 dígitos.">
                    </p>

                    <p>
                        <label for="endereco">Endereço *</label><br>
                        <input type="text" id="endereco" name="endereco" required
                               maxlength="150">
                    </p>

                    <p>
                        <label for="numero">Número *</label><br>
                        <input type="number" id="numero" name="numero" required
                               min="1" max="99999">
                    </p>

                    <p>
                        <label for="complemento">Complemento</label><br>
                        <input type="text" id="complemento" name="complemento" maxlength="80">
                    </p>

                    <p>
                        <label for="cidade">Cidade *</label><br>
                        <input type="text" id="cidade" name="cidade" required
                               autocomplete="address-level2" maxlength="80">
                    </p>

                    <p>
                        <label for="estado">Estado *</label><br>
                        <select id="estado" name="estado" required autocomplete="address-level1">
                            <option value="">Selecione</option>
                            <option value="SP">São Paulo</option>
                            <option value="RJ">Rio de Janeiro</option>
                            <option value="MG">Minas Gerais</option>
                            <option value="PR">Paraná</option>
                            <option value="SC">Santa Catarina</option>
                            <option value="RS">Rio Grande do Sul</option>
                            <option value="BA">Bahia</option>
                            <option value="PE">Pernambuco</option>
                            <option value="CE">Ceará</option>
                            <option value="DF">Distrito Federal</option>
                        </select>
                    </p>
                </fieldset>

                <fieldset>
                    <legend>Tipo de participação</legend>
                    <p>Como deseja contribuir? *</p>
                    <p>
                        <input type="radio" id="doador" name="participacao" value="doador" required>
                        <label for="doador">Doador</label>
                    </p>
                    <p>
                        <input type="radio" id="voluntario" name="participacao" value="voluntario">
                        <label for="voluntario">Voluntário</label>
                    </p>
                    <p>
                        <input type="radio" id="ambos" name="participacao" value="ambos">
                        <label for="ambos">Doador e voluntário</label>
                    </p>
                </fieldset>

                <fieldset>
                    <legend>Confirmação</legend>
                    <p>
                        <input type="checkbox" id="termos" name="termos" required>
                        <label for="termos">Concordo com o uso dos dados para contato sobre a participação na ONG. *</label>
                    </p>
                </fieldset>

                <button type="submit">Enviar cadastro</button>
                <button type="reset">Limpar formulário</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Novo Futuro - Todos os direitos reservados.</p>
    </footer>

</footer>

<script src="scripts/mascaras.js"></script>

<script>
const form = document.getElementById("formCadastro");

form.addEventListener("submit", function(event) {
    event.preventDefault();

    const dados = {
        nome: document.getElementById("nome").value,
        email: document.getElementById("email").value,
        cpf: document.getElementById("cpf").value,
        nascimento: document.getElementById("nascimento").value,
        telefone: document.getElementById("telefone").value,
        cep: document.getElementById("cep").value,
        endereco: document.getElementById("endereco").value,
        numero: document.getElementById("numero").value,
        complemento: document.getElementById("complemento").value,
        cidade: document.getElementById("cidade").value,
        estado: document.getElementById("estado").value
    };

    localStorage.setItem("cadastro", JSON.stringify(dados));

    alert("Cadastro enviado e salvo com sucesso!");
});
</script>

</body>
</html>
